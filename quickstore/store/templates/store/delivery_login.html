{% extends 'store/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl border border-teal-100 mt-10">
    <div class="text-center mb-6">
        <h2 class="text-3xl font-black text-teal-600">🛵 Delivery Partner Login</h2>
        <p class="text-xs text-gray-400 mt-1">Sign in to start receiving 10-minute delivery orders.</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-600 text-xs font-bold p-3 rounded-xl mb-4 text-center">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Username</label>
            <input type="text" name="username" required class="w-full bg-teal-50 border border-teal-200 rounded-2xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" placeholder="Enter your partner username...">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-600 mb-1 uppercase">Password</label>
            <input type="password" name="password" required class="w-full bg-teal-50 border border-teal-200 rounded-2xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3.5 rounded-2xl font-bold shadow-md transition mt-2">
            Login to Shift ⚡
        </button>
    </form>
</div>
{% endblock %}
